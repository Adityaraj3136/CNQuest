<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — CN Quest</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f8fc;
        color: #14203a;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: #fff;
        border: 1px solid #e3e8f2;
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: 0 18px 40px -24px rgba(20, 32, 58, 0.4);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: #fff4e5;
        color: #a15c00;
        font-size: 14px;
        font-weight: 600;
      }
      h1 { font-size: 24px; margin: 18px 0 8px; }
      p { color: #55617a; line-height: 1.6; margin: 0 0 24px; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: #3d5afe;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">○ Offline Mode</span>
      <h1>You are offline</h1>
      <p>
        CN Quest could not reach the network. Cached lessons and games stay available, and any
        progress you make is saved locally and synchronised when you reconnect.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
